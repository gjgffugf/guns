plugins {
    id 'com.android.application'
}

android {
    namespace 'xfan.games.gun'
    compileSdk 34

    defaultConfig {
        applicationId "xfan.games.gun"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
