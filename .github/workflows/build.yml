name: 构建 Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        default: release
        options: [ release, debug ]
      upload_log:
        description: 总是上传完整导出日志（排错用）
        type: boolean
        default: true

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false"

jobs:
  build-android:
    name: 导出 APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          [ -n "$SM" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          # 校验，避免 --install 静默失败
          test -d "$ANDROID_HOME/platforms/android-34" || { echo "::error::android-34 未安装"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/34.0.0" || { echo "::error::build-tools 34.0.0 未安装"; exit 1; }

      - name: 安装 Godot ${{ env.GODOT_VERSION }} headless
        run: |
          set -euo pipefail
          cd /tmp
          curl -fSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q -o godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: 安装导出模板
        run: |
          set -euo pipefail
          cd /tmp
          curl -fSL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q -o templates.tpz
          mv templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          # 必须校验模板真的落到位，否则 gradle 导出会静默失败
          ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          test -f "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/android_source.zip" \
            || { echo "::error::android_source.zip 缺失，导出模板不完整"; exit 1; }

      - name: 安装 Android 构建模板到项目（gradle 工程）
        run: |
          set -euo pipefail
          TDIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          SRC="$TDIR/android_source.zip"
          test -f "$SRC" || { echo "::error::找不到 $SRC"; ls -l "$TDIR"; exit 1; }

          # Godot 4 的 Android 导出走 gradle，必须先把构建模板装到 res://android/build/
          rm -rf android/build
          mkdir -p android/build
          unzip -q -o "$SRC" -d android/build/
          # 告诉 Godot 这个目录是构建产物，不要当资源导入
          touch android/build/.gdignore
          # 记录模板版本，Godot 用它判断模板是否匹配
          echo "${GODOT_VERSION}.${GODOT_STATUS}" > android/.build_version

          # 校验关键文件
          for f in android/build/build.gradle android/build/settings.gradle; do
            test -f "$f" || { echo "::error::$f 未生成，模板解压异常"; ls -la android/build/ | head -30; exit 1; }
          done
          echo "构建模板已安装:"
          ls android/build/

      - name: 生成签名密钥（100 年有效期）
        env:
          KS_STORE_PASS: xfangames          # 库密码
          KS_ALIAS: xfan                    # 库名 / 别名
          KS_KEY_PASS: games2287681747      # 密钥密码
          KS_VALIDITY: "36500"              # 36500 天 ≈ 100 年
        run: |
          set -euo pipefail
          KS="${HOME}/breakbind.keystore"
          rm -f "$KS"

          if [ "$KS_STORE_PASS" = "$KS_KEY_PASS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias "$KS_ALIAS" \
              -storepass "$KS_STORE_PASS" -keypass "$KS_KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity "$KS_VALIDITY" \
              -dname "CN=xfan,OU=xfan.games,O=xfan Games,L=GZ,ST=GD,C=CN"
            EFFECTIVE="$KS_STORE_PASS"
          else
            # Godot 的 Android 导出只有「一个」密码字段，会同时用作
            # --ks-pass 和 --key-pass，所以两个口令必须一致。
            # 这里先按你给的两个口令建成 JKS，再把密钥口令对齐到库口令。
            keytool -genkeypair -v -storetype JKS -keystore "$KS" \
              -alias "$KS_ALIAS" \
              -storepass "$KS_STORE_PASS" -keypass "$KS_KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity "$KS_VALIDITY" \
              -dname "CN=xfan,OU=xfan.games,O=xfan Games,L=GZ,ST=GD,C=CN"
            keytool -keypasswd -keystore "$KS" -alias "$KS_ALIAS" \
              -storepass "$KS_STORE_PASS" -keypass "$KS_KEY_PASS" \
              -new "$KS_STORE_PASS"
            EFFECTIVE="$KS_STORE_PASS"
          fi

          # 立刻校验，口令不对就当场失败
          keytool -list -v -keystore "$KS" -alias "$KS_ALIAS" -storepass "$EFFECTIVE" \
            | grep -q "Alias name: $KS_ALIAS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$EFFECTIVE" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "keystore 就绪: $KS (alias=$KS_ALIAS)"
      - name: 写入编辑器配置（SDK / JDK / 签名）
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/breakbind.keystore"
          export/android/debug_keystore_user = "${KEYSTORE_ALIAS}"
          export/android/debug_keystore_pass = "${KEYSTORE_PASS}"
          export/android/shutdown_adb_on_exit = false
          EOF
          sed -i 's/^          //' "${HOME}/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          cat "${HOME}/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: 预热编辑器缓存（避免 headless 崩溃）
        run: |
          godot --headless --editor --quit || true

      - name: GDScript 预检（快速抓解析错误）
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 tools/check_gd.py || {
            echo "::warning::预检发现问题，继续构建但很可能失败，请按上面提示修正"; }

      - name: 检查资源完整性
        run: |
          set -euo pipefail
          echo "=== 仓库中与 res:// 相关的关键资源 ==="
          MISSING=0
          for f in \
            assets/fonts/ui_font.ttf \
            assets/splash/splash.ogv \
            assets/splash/splash_fallback.png \
            assets/sfx/ui_click.wav assets/sfx/ui_transition.wav \
            assets/sfx/shoot.wav assets/sfx/hitmark.wav \
            assets/sfx/reload.wav assets/sfx/hurt.wav assets/sfx/step.wav ; do
            if [ -f "$f" ]; then echo "  [OK]      $f"; else echo "  [MISSING] $f"; MISSING=1; fi
          done
          echo "--- git 是否忽略了这些文件 ---"
          git check-ignore -v assets/fonts/ui_font.ttf assets/sfx/shoot.wav || echo "  （未被 .gitignore 忽略）"
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::assets/ 下有文件没提交进仓库。请在本机执行: git add -f assets && git commit && git push"
            echo "::error::当前仓库 assets 目录内容如下:"
            ls -laR assets/ || true
            exit 1
          fi

      - name: 导入项目资源
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --import 2>&1 | tee build/import.log | tail -30
          if grep -iE "error|failed|script error" build/import.log; then
            echo "::error::导入资源阶段有脚本错误，见 build/import.log"
            exit 1
          fi
          echo "导入完成"

      - name: 导出 APK
        id: export
        run: |
          set -euo pipefail
          mkdir -p build
          BT="${{ github.event.inputs.build_type || 'release' }}"
          OUT="$PWD/build/breakbind-battlefield.apk"
          echo "构建类型: $BT   输出: $OUT"

          # 必须用绝对路径；且 keystore 密码与 key 密码一致
          KS="${KEYSTORE_PATH:-$HOME/breakbind.keystore}"
          KPASS="${KEYSTORE_PASS:-xfangames}"
          KALIAS="${KEYSTORE_ALIAS:-xfan}"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$KS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KPASS"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$KS"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="$KALIAS"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$KPASS"
          echo "release keystore: $GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          test -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            || { echo "::error::keystore 不存在"; exit 1; }

          # 完整日志落盘，不再让 tail 吞掉退出码
          if [ "$BT" = "debug" ]; then
            godot --headless --verbose --export-debug "Android" "$OUT" 2>&1 | tee build/export.log
            STATUS=${PIPESTATUS[0]}
          else
            godot --headless --verbose --install-android-build-template --export-release "Android" "$OUT" 2>&1 | tee build/export.log
            STATUS=${PIPESTATUS[0]}
            if [ "$STATUS" -ne 0 ] || [ ! -f "$OUT" ]; then
              echo "::warning::release 导出失败，自动回退到 debug 导出"
              rm -f "$OUT"
              godot --headless --verbose --install-android-build-template --export-debug "Android" "$OUT" 2>&1 | tee build/export-debug.log
              STATUS=${PIPESTATUS[0]}
              cat build/export-debug.log >> build/export.log
            fi
          fi
          echo "godot 退出码: $STATUS"

          # 无论成功失败都把关键报错打到日志里
          echo "----- 日志中的错误行 -----"
          grep -inE "error|failed|cannot|could not|unable|exception|not found" build/export.log | head -40 || true
          echo "--------------------------"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Godot 导出失败（退出码 $STATUS），完整日志见 build/export.log"
            exit 1
          fi
          if [ ! -f "$OUT" ]; then
            echo "::error::导出结束但未找到 $OUT"
            ls -lhR build/ || true
            exit 1
          fi
          ls -lh "$OUT"

      - name: 上传完整导出日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: build/*.log
          if-no-files-found: warn

      - name: 校验 APK 包名与签名
        if: success()
        run: |
          set -euo pipefail
          OUT="$PWD/build/breakbind-battlefield.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ -x "$AAPT" ]; then
            echo "=== aapt dump badging ==="
            "$AAPT" dump badging "$OUT" | head -8
            PKG=$("$AAPT" dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            echo "解析到的包名: $PKG"
            if [ "$PKG" != "xfan.games.gun" ]; then
              echo "::error::包名不对（期望 xfan.games.gun，实际 $PKG）"
              exit 1
            fi
            echo "::notice::包名校验通过: $PKG"
          else
            echo "::warning::找不到 aapt，跳过包名校验"
          fi
          ls -lh "$OUT"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: breakbind-battlefield-apk
          path: build/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          generate_release_notes: true
