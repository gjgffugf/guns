name: 构建 APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        default: release
        options: [release, debug]

jobs:
  verify:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 校验 workflow 文件（重复键会导致工作流无法启动）
        run: node tools/check-yaml.cjs

      - name: 类型检查（TypeScript 严格模式）
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

  browser:
    name: 浏览器端验证（界面 & 控件）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 安装 playwright（只用它的驱动，浏览器用系统 Chrome）
        run: npm i -D playwright@1.47.2 --no-audit --no-fund
      - name: 构建（不压缩，便于定位报错）
        run: npx vite build --minify false --outDir dist-debug
      - name: 真实浏览器验证
        env:
          BB_DIST: ${{ github.workspace }}/dist-debug
        run: node tools/browser-check.cjs

  build:
    name: 构建 APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建 Web 资源
        run: npm run build

      - name: 生成 Android 工程
        run: |
          # android/ 已在 .gitignore 里，CI 上必须先 add 才能 sync
          if [ ! -d android/app ]; then npx cap add android; fi
          npx cap sync android

      - name: 配置横屏与全屏
        run: node tools/setup-android.mjs android

      - name: 生成并注入签名密钥
        env:
          BB_KS_STOREPASS: ${{ secrets.BB_KS_STOREPASS || 'xfangames' }}
          BB_KS_ALIAS: ${{ secrets.BB_KS_ALIAS || 'xfan' }}
          BB_KS_KEYPASS: ${{ secrets.BB_KS_KEYPASS || 'games2287681747' }}
          BB_KS_VALIDITY: '36500'
        run: node tools/setup-signing.mjs android

      - name: 校验包名
        run: |
          grep -q 'applicationId "xfan.games.gun"' android/app/build.gradle \
            || grep -q "applicationId = \"xfan.games.gun\"" android/app/build.gradle \
            || { echo "::error::包名不是 xfan.games.gun"; exit 1; }
          echo "包名校验通过: xfan.games.gun"

      - name: 赋权 gradlew
        run: chmod +x android/gradlew

      - name: 构建
        working-directory: android
        run: |
          TASK="assembleDebug"
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "release" ]; then
            TASK="assembleRelease"
          fi
          # pipefail 开启后，用 PIPESTATUS[0] 拿到 gradle 自己的退出码，
          # 否则 tee 成功会把 gradle 的失败吞掉
          set -o pipefail
          ./gradlew $TASK --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: 校验 APK 产出
        if: always()
        run: |
          ls -lh android/app/build/outputs/apk/*/*.apk 2>/dev/null || {
            echo "::error::没有找到 APK"; ls -lhR android/app/build/outputs/ 2>/dev/null; exit 1; }

      - name: 校验 APK 包名
        if: always()
        run: |
          APK=$(ls android/app/build/outputs/apk/*/*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "没有 APK，跳过包名校验"; exit 0; }
          echo "产物: $APK"
          # 新版 build-tools 只提供 aapt2；找不到工具就跳过，不要因此让构建失败
          AAPT=""
          for c in aapt aapt2; do command -v $c >/dev/null && AAPT=$c && break; done
          if [ -z "$AAPT" ] && [ -n "$ANDROID_HOME" ]; then
            for f in "$ANDROID_HOME"/build-tools/*/aapt2 "$ANDROID_HOME"/build-tools/*/aapt; do
              [ -x "$f" ] && AAPT="$f" && break
            done
          fi
          if [ -z "$AAPT" ]; then
            echo "警告：找不到 aapt/aapt2，跳过包名校验（包名由 capacitor.config.ts 保证）"
            exit 0
          fi
          ID=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*package: name='([^']+)'.*/\1/")
          echo "解析到包名: $ID"
          [ "$ID" = "xfan.games.gun" ] || { echo "::error::APK 包名是 $ID，应为 xfan.games.gun"; exit 1; }
          echo "APK 包名校验通过"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakbind-battlefield
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
